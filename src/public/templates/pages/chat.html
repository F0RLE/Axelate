                <div id="chat-container">
                    <div
                        class="chat-header-question"
                        id="chat-header-question"
                    >
                        What are you focused on?
                    </div>

                    <div id="chat-messages">
                        <!-- messages -->
                    </div>

                    <!-- Clear chat button (floating, bottom-right) -->
                    <button
                        id="clear-chat-btn"
                        class="chat-clear-btn"
                        title="Clear Chat"
                    >
                        <svg class="icon">
                            <use href="#icon-trash"></use>
                        </svg>
                        <span
                            class="chat-clear-text"
                            data-i18n="ui.launcher.web.chat_clear"
                        >Clear Chat</span>
                    </button>

                    <div id="chat-compose" class="chat-compose-wrapper">
                        <div id="chat-token-count" class="chat-token-count"></div>
                        <div
                            id="chat-attachments"
                            class="hidden"
                        ></div>
                        <div class="chat-input-bar">
                            <input
                                id="chat-file-input"
                                type="file"
                                multiple
                                class="hidden"
                            />
                            <div class="chat-input-edge chat-input-edge--left">
                                <button
                                    id="chat-attach-btn"
                                    class="chat-action-btn"
                                    title="Attach"
                                >
                                    <svg
                                        class="icon icon-chat"
                                    >
                                        <use href="#icon-plus"></use>
                                    </svg>
                                </button>
                            </div>
                            <div class="chat-input-field">
                                <textarea
                                    id="chat-input"
                                    class="chat-textarea mono"
                                    placeholder="Ask something..."
                                    rows="1"
                                    data-i18n-placeholder="ui.launcher.web.chat_placeholder_ask"
                                ></textarea>
                                <div
                                    id="chat-input-placeholder"
                                    class="chat-input-placeholder mono"
                                    data-i18n="ui.launcher.web.chat_placeholder_ask"
                                >
                                    Ask something...
                                </div>
                            </div>
                            <div class="chat-input-edge chat-input-edge--right">
                                <button
                                    id="chat-voice-btn"
                                    class="chat-action-btn"
                                    title="Voice"
                                >
                                    <svg
                                        class="icon icon-chat"
                                    >
                                        <use href="#icon-mic"></use>
                                    </svg>
                                </button>
                                <button
                                    id="chat-send-btn"
                                    class="chat-action-btn primary"
                                    title="Send"
                                >
                                    <svg
                                        class="icon icon-chat"
                                    >
                                        <use href="#icon-send"></use>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
