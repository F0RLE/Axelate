<div class="settings-wrapper">
    <div id="settings-grid" class="settings-grid">
        <div class="module-card">
            <div class="module-title" data-i18n="ui.launcher.settings.taskbar_title">
                Sidebar Management
            </div>
            <div class="module-desc" data-i18n="ui.launcher.settings.taskbar_desc">
                Configure sidebar page visibility
            </div>
            <div id="taskbar-toggles" class="settings-toggle-grid"></div>
        </div>

        <div class="module-card">
            <div class="module-title" data-i18n="ui.launcher.settings.monitor_title">
                Monitoring Management
            </div>
            <div class="module-desc" data-i18n="ui.launcher.settings.monitor_desc">
                System monitor visibility settings
            </div>
            <div id="monitor-toggles" class="settings-toggle-grid"></div>
        </div>

        <div class="module-card module-card--agent-control">
            <div class="module-title" data-i18n="ui.launcher.settings.agent_control_title">

            </div>
            <div class="module-desc" data-i18n="ui.launcher.settings.agent_control_desc">

        </div>
