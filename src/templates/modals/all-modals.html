<!-- Language Selection Modal -->
<div id="lang-modal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-title" data-i18n="ui.launcher.web.select_language">Select Language</div>
        <div class="modal-desc" data-i18n="ui.launcher.web.select_language_desc">
            Choose your preferred language for the interface
        </div>
        <div class="lang-selector">
            <div class="lang-option lang-modal-btn" data-lang="en">
                <div class="lang-option-icon">🇬🇧</div>
                <div class="lang-option-name" data-i18n="ui.launcher.language.english">English</div>
                <div class="lang-option-native">English</div>
            </div>
            <div class="lang-option lang-modal-btn" data-lang="ru">
                <div class="lang-option-icon">🇷🇺</div>
                <div class="lang-option-name" data-i18n="ui.launcher.language.russian">Russian</div>
                <div class="lang-option-native">Русский</div>
            </div>
            <div class="lang-option lang-modal-btn" data-lang="zh">
                <div class="lang-option-icon">🇨🇳</div>
                <div class="lang-option-name" data-i18n="ui.launcher.language.chinese">Chinese</div>
                <div class="lang-option-native">中文</div>
            </div>
        </div>
        <button id="confirm-lang-btn" class="btn btn-primary" data-i18n="ui.launcher.web.confirm">Confirm</button>
    </div>
</div>

<!-- Close Confirmation Modal -->
<div id="close-confirm-modal" class="modal-overlay hidden">
    <div class="modal close-confirm-modal">
        <div class="modal-title close-confirm-title" data-i18n="ui.launcher.modal.confirm_close_title">Confirm Close</div>
        <div class="modal-message close-confirm-message" data-i18n="ui.launcher.web.close_warning">
            Are you sure you want to close the launcher? All services will be stopped.
        </div>
        <div class="modal-actions">
            <button id="cancel-close-btn" class="modal-btn modal-btn-cancel" data-i18n="ui.launcher.button.cancel">Cancel</button>
            <button id="confirm-close-btn" class="modal-btn modal-btn-confirm" data-i18n="ui.launcher.button.close">Close</button>
        </div>
    </div>
</div>

<!-- Download Settings Modal -->
<div id="download-settings-overlay" class="modal-overlay hidden">
    <div class="modal download-settings-modal">
        <div class="modal-title download-settings-title">
            <svg class="icon download-settings-title-icon"><use href="#icon-settings"></use></svg>
            <span data-i18n="ui.launcher.settings.download_settings_title">Download Settings</span>
        </div>
        <div class="download-settings-body">
            <label class="download-settings-row">
                <span class="download-limit-label" data-i18n="ui.launcher.settings.limit_speed">Limit Speed</span>
                <input type="checkbox" id="download-speed-limit-toggle" class="download-speed-toggle" />
            </label>
            <div id="speed-limit-controls" class="opacity-50 pointer-none">
                <label for="download-speed-slider" class="download-slider-label">
                    <span data-i18n="ui.launcher.settings.max_speed">Max Speed:</span>
                    <span id="speed-limit-value" class="download-slider-value">50</span> MB/s
                </label>
                <input type="range" id="download-speed-slider" class="download-speed-slider" min="1" max="200" value="50" />
                <div class="download-slider-range">
                    <span>1 MB/s</span>
                    <span>200 MB/s</span>
                </div>
            </div>
        </div>
        <div class="download-settings-footer">
            <button id="close-download-settings-btn" class="modal-btn modal-btn-primary w-100" data-i18n="ui.launcher.web.confirm">Confirm</button>
        </div>
    </div>
</div>

<!-- Module Settings Modal -->
<div id="module-settings-modal" class="modal-overlay module-settings-overlay hidden">
    <div class="app-modal module-settings-modal-inner">
        <div class="app-modal-header">
            <h2 id="module-settings-title" class="app-modal-title" data-i18n="ui.launcher.module.settings_title">Module Settings</h2>
            <button id="close-module-settings-btn" class="close-btn" data-i18n-aria-label="ui.launcher.button.close">
                <svg class="icon"><use href="#icon-close"></use></svg>
            </button>
        </div>
        <div id="module-settings-content" class="module-settings-content">
            <div id="module-config-modal-active" class="module-config-modal-active">
                <div class="module-settings-empty">
                    <span data-i18n="ui.launcher.module.no_settings">No settings available for this module</span>
                </div>
            </div>
        </div>
    </div>
</div>
