<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Python AI Tool Settings</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
            }

            body {
                margin: 0;
                padding: 16px;
                color: #f5f5f7;
                background: #15161a;
            }

            label {
                display: grid;
                gap: 8px;
                font-size: 13px;
            }

            textarea {
                min-height: 120px;
                resize: vertical;
                border: 1px solid #3a3d46;
                border-radius: 6px;
                padding: 10px;
                color: inherit;
                background: #0f1014;
            }

            button {
                margin-top: 12px;
                border: 0;
                border-radius: 6px;
                padding: 9px 12px;
                color: #fff;
                background: #2563eb;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <label>
            Prompt
            <textarea id="prompt"></textarea>
        </label>
        <button id="save" type="button">Save</button>
        <script type="module">
            import { AxelateSettingsBridge } from './axelate-settings-bridge.js';

            const bridge = new AxelateSettingsBridge();
            const prompt = document.getElementById('prompt');
            const saveButton = document.getElementById('save');

            bridge.ready();
            const { settings } = await bridge.waitForHost();
            prompt.value = settings.prompt ?? 'Write a short status update.';
            bridge.rendered();

            saveButton.addEventListener('click', async () => {
                saveButton.disabled = true;
                try {
                    await bridge.saveSettings({ prompt: prompt.value });
                } finally {
                    saveButton.disabled = false;
                }
            });
        </script>
    </body>
</html>
