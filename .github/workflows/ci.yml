name: Strict CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "nightly"]
  pull_request:
    branches: ["main", "nightly"]

concurrency:
  group: strict-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-frontend:
    name: Frontend Strict Check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26.1.0"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # node24
        continue-on-error: true
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install Dependencies
        run: |
          cd src
          npm ci

      - name: Strict Linting
        run: |
          cd src
          npm run lint

      - name: Check Formatting
        run: |
          cd src
          npm run format:check

      - name: Type Check & Build
        run: |
          cd src
          npm run build
        # 'npm run build' runs bindings sync + typecheck + vite build

      - name: Run Frontend Tests
        run: |
          cd src
          npm run test

      - name: Security Audit (npm)
        run: |
          cd src
          npm audit --audit-level=moderate
        continue-on-error: true  # Don't fail CI, but report issues

  check-backend:
    name: Backend Strict Check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0
          components: clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # node24
        continue-on-error: true
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Clippy (Strict Linting)
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features -- -D warnings
        # Fails if there are any warnings

      - name: Check Backend Targets
        run: |
          cd src-tauri
          cargo check --all-targets --all-features --verbose

      - name: Run Backend Tests
        run: |
          cd src-tauri
          cargo test --all-targets --all-features --verbose

      - name: Security Audit (Rust)
        run: |
          cargo install cargo-audit --locked --quiet
          cd src-tauri
          cargo audit
        continue-on-error: true  # Don't fail CI, but report issues

      - name: Install Coverage Tool
        if: github.event_name == 'workflow_dispatch'
        run: cargo install cargo-llvm-cov --locked --quiet

      - name: Generate Rust Coverage Report
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd src-tauri
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload Rust Coverage Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: rust-lcov
          path: src-tauri/lcov.info

  check-cross-platform:
    name: Cross-platform Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26.1.0"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # node24
        continue-on-error: true
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install Dependencies
        run: |
          cd src
          npm ci

      - name: Frontend Type Check
        run: |
          cd src
          npm run typecheck

      - name: Backend Target Check
        run: |
          cd src-tauri
          cargo check --all-targets --all-features
