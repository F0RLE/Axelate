name: Strict CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "nightly"]
  pull_request:
    branches: ["main", "nightly"]

concurrency:
  group: strict-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-frontend:
    name: Frontend Strict Check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install Dependencies
        run: |
          cd src
          npm ci

      - name: Strict Linting
        run: |
          cd src
          npm run lint

      - name: Check Formatting
        run: |
          cd src
          npm run format:check

      - name: Type Check & Build
        run: |
          cd src
          npm run build
        # 'npm run build' runs bindings sync + typecheck + vite build

      - name: Check Bundle Size
        run: |
          cd src
          npm run check-size

      - name: Run Frontend Tests
        run: |
          cd src
          npm run test

      - name: Security Audit (npm)
        run: |
          cd src
          npm audit --audit-level=moderate
        continue-on-error: true  # Don't fail CI, but report issues

  check-backend:
    name: Backend Strict Check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.94.1
          components: clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Clippy (Strict Linting)
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features -- -D warnings
        # Fails if there are any warnings

      - name: Check Backend Targets
        run: |
          cd src-tauri
          cargo check --all-targets --all-features --verbose

      - name: Run Backend Tests
        run: |
          cd src-tauri
          cargo test --all-targets --all-features --verbose

      - name: Security Audit (Rust)
        run: |
          cargo install cargo-audit --locked --quiet
          cd src-tauri
          cargo audit
        continue-on-error: true  # Don't fail CI, but report issues

      - name: Install Coverage Tool
        run: cargo install cargo-llvm-cov --locked --quiet

      - name: Generate Rust Coverage Report
        run: |
          cd src-tauri
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload Rust Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: src-tauri/lcov.info
