name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.94.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: |
          cd src
          npm ci

      - name: Frontend Security Audit
        run: |
          cd src
          npm audit --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Backend Security Audit
        run: |
          cd src-tauri
          cargo audit

      - name: Build and publish with official Tauri action
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Axelate {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      - name: Generate release checksums
        run: node .github/scripts/workflow.mjs release:checksums

      - name: Verify release hardening
        run: node .github/scripts/workflow.mjs release:verify-hardening

      - name: Upload release checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Attach checksums to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "src-tauri/target/release/bundle/SHA256SUMS.txt" --clobber
