name: Release Build

run-name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release"
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag, versions, and main ancestry
        shell: powershell
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease format."
          }

          $version = $env:RELEASE_TAG.Substring(1)
          $rootVersion = (Get-Content package.json | ConvertFrom-Json).version
          $frontendVersion = (Get-Content src/package.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value

          if ($rootVersion -ne $version -or $frontendVersion -ne $version -or $cargoVersion -ne $version) {
            throw "Release tag $env:RELEASE_TAG does not match manifest versions: root=$rootVersion frontend=$frontendVersion cargo=$cargoVersion."
          }

          git fetch origin main --force
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:RELEASE_TAG must point to a commit that is reachable from origin/main."
          }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "26.1.0"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef # node24
        continue-on-error: true
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install frontend dependencies
        run: |
          cd src
          npm ci

      - name: Frontend Security Audit
        run: |
          cd src
          npm audit --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Backend Security Audit
        run: |
          cd src-tauri
          cargo audit

      - name: Build and publish with official Tauri action
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Axelate ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

      - name: Generate release checksums
        run: node .github/scripts/workflow.mjs release:checksums

      - name: Verify release hardening
        run: node .github/scripts/workflow.mjs release:verify-hardening

      - name: Upload release checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Attach checksums to GitHub release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:RELEASE_TAG" "src-tauri/target/release/bundle/SHA256SUMS.txt" --clobber
