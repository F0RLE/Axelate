version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/src"
    target-branch: "nightly"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    labels:
      - "dependencies"
      - "security"
    groups:
      npm-runtime:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      npm-majors:
        update-types:
          - "major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    target-branch: "nightly"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"
    groups:
      cargo-safe:
        update-types:
          - "minor"
          - "patch"
      cargo-majors:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "nightly"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "security"
    groups:
      github-actions:
        patterns:
          - "*"
