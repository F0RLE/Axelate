[package]
name = "axelate"
version = "0.1.5"
description = "Axelate"
authors = ["F0RLE"]
edition = "2024"
rust-version = "1.93.0"

[lib]
name = "axelate_lib"
path = "src/lib.rs"

[[bin]]
name = "Axelate"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.9.5", features = ["image-ico", "image-png", "tray-icon"] }
tauri-plugin-shell = "2.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
env_logger = "0.11.8"
thiserror = "2.0.18"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging"
] }
dirs = "6.0.0"
once_cell = "1.21.3"
sysinfo = "0.38.0"
chrono = { version = "0.4.43", features = ["serde"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "stream", "native-tls", "gzip", "brotli", "deflate", "http2"] }
tokio = { version = "1.49.0", features = ["full"] }
futures-util = "0.3.31"
tiktoken-rs = "0.9.1"
nvml-wrapper = "0.11.0"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.2"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.9.2"
machine-uid = "0.5.4"
sha2 = "0.10.9"
zip = "7.2.0"
tempfile = "3.24.0"
hex = "0.4.3"
wmi = "0.18.0"
axum = { version = "0.8.8", features = ["macros", "ws"] }
tower-http = { version = "0.6.8", features = ["fs", "cors", "trace"] }
tauri-plugin-single-instance = "2.3.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

# Use forked wry with permission handler API
# PR: https://github.com/tauri-apps/wry/pull/1656
[patch.crates-io]
wry = { git = "https://github.com/F0RLE/wry.git", branch = "feat/webview2-default-allow" }
