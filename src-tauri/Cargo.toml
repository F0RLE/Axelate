# ==============================================================================
#  AXELATE PROJECT MANIFEST
#  Windows-first AI Workstation
# ==============================================================================
[package]
name          = "axelate"
version       = "0.2.0"
description   = "Axelate: Windows-first AI Workstation."
authors       = ["F0RLE"]
edition       = "2024"
rust-version  = "1.95.0"
license       = "Apache-2.0"
repository    = "https://github.com/F0RLE/Axelate"
homepage      = "https://github.com/F0RLE/Axelate"
keywords      = ["tauri", "gui", "system", "ai", "privacy"]
categories    = ["gui", "system-programming"]
publish       = false
default-run   = "Axelate"

# --- Artifacts ---
[lib]
name = "axelate_lib"
path = "src/lib.rs"

[[bin]]
name = "Axelate"
path = "src/main.rs"

# ==============================================================================
#  DEPENDENCIES
# ==============================================================================

# --- Tauri Ecosystem (UI & Runtime) ---
[dependencies.tauri]
version  = "~2.11"
features = ["image-ico", "image-png", "tray-icon", "unstable"]

[dependencies]
tauri-plugin-shell             = "~2.3"
tauri-plugin-dialog            = "~2.7"
tauri-plugin-fs                = "~2.5"
tauri-plugin-single-instance   = "~2.4"
tauri-plugin-global-shortcut   = "~2.3"
tauri-plugin-clipboard-manager = "~2.3"

# --- Frontend Bridge (Types & Serialization) ---
specta           = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
tauri-specta     = { version = "2.0.0-rc.25", features = ["typescript", "derive"] }
specta-typescript = "0.0.12"
serde            = { version = "1.0.228",     features = ["derive"] }
serde_json       = "1.0.150"
toml             = "1.1"

# --- Async Core & Networking ---
tokio        = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
reqwest      = { version = "0.13.4", features = ["json", "stream", "native-tls", "gzip"], default-features = false }
futures-util = "0.3.32"
scraper      = "0.27.0"

# --- System, Hardware & Low Level ---
sysinfo      = "0.39.3"
nvml-wrapper = "0.12.1" # NVIDIA Management Library
wmi          = "0.18.4" # Windows Management Instrumentation
machine-uid  = "0.6.0"  # Hardware ID generation
dirs         = "6.0.0"
once_cell    = "1.21.4"
thiserror    = "2.0.18"
num_cpus     = "1.17.0"
sys-locale   = "0.3.2"

windows-sys = { version = "0.61.2", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging"
] }

# --- Cryptography & Security (DRM Layer) ---
aes-gcm = "0.10.3"
sha2    = "0.11.0"
rand    = "0.10.1"
base64  = "0.22.1"
hex     = "0.4.3"

# --- AI & Logic Utilities ---
tiktoken-rs = "0.12.0" # Token counting
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2.5"
chrono      = { version = "0.4.44", features = ["serde"] }
zip         = "8.6.0"
tempfile    = "3.27.0"
log         = "0.4.30"
# env_logger = "0.11.8" - Replaced by tracing
dashmap = "6.2.1"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
bitflags = { version = "2.11.1", features = ["serde"] }
async-trait = "0.1.89"
flate2 = "1.1.9"
tar = "0.4.46"
sevenz-rust2 = "0.21.0"
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.178"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Media_SpeechRecognition",
    "System",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
windows-future = "0.3.2"

# --- Build Time ---
[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

# ==============================================================================
#  OPTIMIZATION PROFILES (The 0.7 MB Magic)
# ==============================================================================
[profile.release]
codegen-units   = 1       # Maximum optimization (slower build, faster binary)
lto             = true    # Link Time Optimization (monolithic build)
opt-level       = "s"     # Optimize for size with better perf than "z"
panic           = "abort" # Remove panic unwinding (smaller binary)
strip           = true    # Remove debug symbols
incremental     = false   # Disable incremental build for cleaner release
overflow-checks = true    # Security over speed (critical for finance/crypto)

# ==============================================================================
#  CODE QUALITY & LINTS (Zero Tolerance Policy)
# ==============================================================================
[lints.rust]
unsafe_code                   = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
future_incompatible           = { level = "deny", priority = -1 }
nonstandard_style             = { level = "deny", priority = -1 }
rust_2018_idioms              = { level = "deny", priority = -1 }
rust_2021_compatibility       = { level = "deny", priority = -1 }

[lints.clippy]
# -- Strictness Level --
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }

# -- Critical Denials (Safety) --
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"

# -- Warnings (Clean Code) --
indexing_slicing                   = "warn"
unreachable                        = "warn"
use_debug                          = "warn"
print_stdout                       = "warn"
print_stderr                       = "warn"
clone_on_ref_ptr                   = "deny"
expl_impl_clone_on_copy            = "deny"
if_not_else                        = "warn"
implicit_clone                     = "warn"
match_same_arms                    = "warn"
needless_pass_by_value             = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned      = "warn"
string_add_assign                  = "warn"
type_repetition_in_bounds          = "warn"
unnecessary_wraps                  = "warn"
used_underscore_binding            = "warn"
